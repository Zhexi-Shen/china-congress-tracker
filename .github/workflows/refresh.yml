name: refresh-and-deploy

on:
  schedule:
    # Hourly, at :17 past the hour (UTC)
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::httr2, any::jsonlite, any::reactable, any::htmltools

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Fetch data
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS || '72' }}
          MEETING_LOOKBACK_HOURS: ${{ vars.MEETING_LOOKBACK_HOURS || '720' }}
        run: Rscript R/fetch.R

      - name: Commit data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh data snapshot"
            git push
          fi
        continue-on-error: true

      - name: Render site
        run: quarto render

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
